<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finfluence App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm neutral shell; each business card carries its own brand colour and is the only loud thing on screen. */
:root{
  --bg:#F2F2EE;
  --surface:#FFFFFF;
  --ink:#141518;
  --muted:#6C6E73;
  --line:#E3E3DD;
  --accent:#2F45FF;
  --accent-soft:#E8EBFF;
  --ok:#0F7A55; --ok-soft:#E3F5EC;
  --warn:#8A5A00; --warn-soft:#FFF2D6;
  --err:#B42318; --err-soft:#FDE8E6;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);caret-color:var(--accent)}
::placeholder{color:#9A9CA3}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}

#app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand i:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.mode{display:flex;background:#E6E6E0;border-radius:99px;padding:3px;font-size:13px;font-weight:600}
.mode button{padding:6px 12px;border-radius:99px;color:var(--muted);transition:.2s}
.mode button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

main{flex:1;overflow-y:auto;padding:6px 20px 110px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.h-title{font-size:32px;font-weight:800;line-height:1.05;margin:10px 0 4px}
.h-sub{color:var(--muted);margin-bottom:18px}
.section{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9A9CA3;margin:34px 0 12px}

/* bottom nav */
nav.tabs{position:absolute;left:12px;right:12px;bottom:14px;background:rgba(20,21,24,.94);backdrop-filter:blur(10px);border-radius:24px;display:flex;padding:6px;z-index:5}
nav.tabs{left:50%!important;right:auto!important;transform:translateX(-50%);gap:4px}
nav.tabs button{flex:none;display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:18px;color:#8D9097;font-size:13px;font-weight:600;transition:all .3s cubic-bezier(.2,.8,.2,1)}
nav.tabs button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .3s cubic-bezier(.2,.8,.2,1)}
nav.tabs button.on span{max-width:90px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink);background:#fff}

/* wallet cards */
.stack{display:flex;flex-direction:column}
.card{position:relative;border-radius:22px;padding:18px 20px;color:var(--c-ink);background:var(--c);overflow:hidden;text-align:left;width:100%;min-height:196px;display:flex;flex-direction:column;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);transform:perspective(900px) translateY(var(--ty,0)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s;will-change:transform}
.card.tilting{transition:transform .08s linear}
.tex{position:absolute;inset:0;opacity:.09;pointer-events:none;background-size:64px 64px}
.card:after{content:"";position:absolute;inset:-40%;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 48%,rgba(255,255,255,.06) 52%,transparent 60%);transform:translateX(-60%);animation:sweep 7s ease-in-out infinite;animation-delay:calc(var(--i,0)*1.1s + 1.2s);mix-blend-mode:soft-light}
@keyframes sweep{0%,70%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.32),transparent 45%);opacity:0;transition:opacity .3s;mix-blend-mode:overlay}
.card.tilting .glare{opacity:1}
.card.is-ready{box-shadow:0 0 0 2px var(--c-ink),0 0 0 5px var(--c),0 18px 40px -10px var(--c);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--c-ink),0 0 0 9px color-mix(in srgb,var(--c) 35%,transparent),0 18px 50px -6px var(--c)}}
.stack .card{animation:deal .8s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i,0)*110ms)}
.stack .card.is-ready{animation:deal .8s cubic-bezier(.2,.9,.25,1) backwards,glow 2.4s ease-in-out 1s infinite;animation-delay:calc(var(--i,0)*110ms),1s}
@keyframes deal{from{opacity:0;transform:perspective(900px) translateY(140px) rotateX(35deg) rotateZ(-4deg) scale(.92)}}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.18),transparent 55%),radial-gradient(90% 70% at 0% 110%,rgba(0,0,0,.22),transparent 60%);pointer-events:none}
.stack .card + .card{margin-top:-128px}
.stack .card:hover{--ty:-8px}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.card-name{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.card-area{font-size:12px;opacity:.75}
.card-pts{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-align:right}
.card-pts small{font-size:15px;opacity:.6;font-weight:600}
.card-foot{margin-top:auto;position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:70%}
.dots span{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.5}
.dots span.f{background:currentColor;opacity:1}
.card-reward{font-size:12px;opacity:.85;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18)}
.pill.ready{background:var(--c-ink);color:var(--c);background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);background-size:250% 100%;animation:shim 2.2s linear infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-100% 0}}

/* card detail */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);margin:4px 0 14px}
.detail .card{min-height:220px;box-shadow:0 20px 40px -18px rgba(0,0,0,.45)}
.big-progress{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em}
.stamps{display:grid;grid-template-columns:repeat(5,44px);justify-content:space-between;row-gap:12px;margin:22px 4px 8px}
.stamp{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed #D3D3CC;color:#C9C9C2;background:transparent}
.stamp svg{width:42%;height:42%}
.prog{height:4px;border-radius:4px;background:#E3E3DD;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--c);border-radius:4px;transform-origin:left;animation:grow-x .9s cubic-bezier(.2,.8,.2,1) .2s backwards}
@keyframes grow-x{from{transform:scaleX(0)}}
.stamp.f{border:0;background:var(--c);color:var(--c-ink)}
.stamp.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn-ink{background:var(--ink);color:#fff}
.btn-brand{background:var(--c);color:var(--c-ink)}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn-accent{background:var(--accent);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}

.codebox{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:18px;margin-top:14px;border:1px solid var(--line)}
.ring{width:74px;height:74px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.code{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.14em;line-height:1;perspective:400px}
.code span{display:inline-block;animation:flap .55s cubic-bezier(.3,1.4,.5,1) backwards;transform-origin:50% 60%}
@keyframes flap{from{transform:rotateX(-95deg);opacity:0}}
.flip{perspective:1100px;cursor:pointer}
.flip-in{display:grid;transition:transform 1s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip-in>*{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip.on .flip-in{transform:rotateY(180deg)}
.card-back{transform:rotateY(180deg);align-items:center;justify-content:center;text-align:center;gap:6px}
.card-back .rw{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;position:relative}
.card-back .gift{width:54px;height:54px;border-radius:50%;background:var(--c-ink);color:var(--c);display:grid;place-items:center;position:relative}
.hint{font-size:13px;color:var(--muted)}

.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(20,21,24,.04),0 8px 24px -16px rgba(20,21,24,.12)}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px}
.li + .li{border-top:1px solid #EEEEE9}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.li .r{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.mini-logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:var(--c-ink);flex:none}
.mini-logo svg{width:20px;height:20px}

/* discover */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;transition:.15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.feature{border-radius:22px;padding:20px;outline:2px solid transparent;background:var(--c);color:var(--c-ink);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;margin-top:16px}
.feature:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.12)}
.diamond-wrap{margin-top:16px;padding:3px;border-radius:25px;background:conic-gradient(from var(--ang),#fff 0deg,#c9ccd6 60deg,#7d8190 120deg,#fff 180deg,#e8d7a8 240deg,#8d93a5 300deg,#fff 360deg);animation:rot 5s linear infinite}
.diamond-wrap .feature{margin-top:0}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes rot{to{--ang:360deg}}
.feature:after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.25) 50%,transparent 58%);animation:sweep 5s ease-in-out infinite;pointer-events:none}
.add{margin-left:auto;padding:7px 13px;border-radius:99px;font-weight:600;font-size:13px;background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:none;transition:.2s}
.add:hover{border-color:var(--ink)}
.add.done{background:var(--ok-soft);color:var(--ok)}

/* offers + wheel */
.wheel-wrap{background:var(--ink);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.wheel-box{position:relative;width:230px;height:230px}
.wheel{width:100%;height:100%;border-radius:50%;transition:transform 4.2s cubic-bezier(.12,.8,.12,1);position:relative;border:6px solid #fff}
.wheel span{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--accent);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.hub{position:absolute;inset:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);font-family:var(--display);font-weight:800;font-size:13px}
.coupon{display:flex;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.coupon .l{background:var(--c);color:var(--c-ink);padding:16px;width:96px;flex:none;display:flex;flex-direction:column;justify-content:center;font-family:var(--display);font-weight:800;font-size:24px;line-height:1;position:relative}
.coupon .l small{font-size:11px;font-family:var(--body);font-weight:600;opacity:.8;margin-top:4px}
.coupon .l:after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg)}
.coupon .rgt{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:2px}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* staff */
.biz-head{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:6px}
.slots{display:flex;gap:10px;justify-content:center;margin:22px 0 8px}
.slot{width:58px;height:70px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;transition:.15s}
.slot.fill{border-color:var(--ink)}
.slots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pad button{height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:24px;transition:transform .08s}
.pad button:active{transform:scale(.95);background:#EAEAE4}
.result{border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:14px;animation:rise .35s ease}
.result b{display:block;font-size:15px}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.warn{background:var(--warn-soft);color:var(--warn)}
.result.err{background:var(--err-soft);color:var(--err)}
.result button{text-decoration:underline;font-weight:700;margin-top:4px}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.demo-hint{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px dashed #C9C9C2;border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.demo-hint button{font-weight:700;color:var(--accent)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .d{font-size:12px;font-weight:700;color:var(--ok)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.chart svg{width:100%;height:120px;display:block}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}
.bars div{flex:1;background:var(--accent);border-radius:6px 6px 2px 2px;position:relative;min-height:4px;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.bars div.dim{background:var(--accent-soft)}
@keyframes grow{from{transform:scaleY(0)}}
.axis{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:6px}
.axis span{flex:1;text-align:center}
textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;resize:none;background:var(--surface);min-height:90px}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:17px;background:var(--surface)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:12px 0 16px}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--ink);flex:none}

/* onboarding */
.onb{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;overflow-y:auto}
.onb-hero{background:var(--c);color:var(--c-ink);padding:46px 24px 30px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.onb-hero:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-120px;background:rgba(255,255,255,.1)}
.onb-body{padding:24px;display:flex;flex-direction:column;gap:4px}
.benefits{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.benefits div{display:flex;gap:10px;align-items:center;font-size:14px}
.benefits i{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-style:normal;font-weight:800;font-size:13px}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:30;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ambient light */
.aura{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aura i{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
.aura i:nth-child(1){background:var(--accent);top:-120px;left:-90px;opacity:.18}
.aura i:nth-child(2){background:#E0512A;top:240px;right:-160px;opacity:.14;animation-duration:22s}
.aura i:nth-child(3){background:#5E2A5E;bottom:-140px;left:20px;opacity:.14;animation-duration:26s}
@keyframes drift{to{transform:translate(60px,80px) scale(1.15)}}
.top,main{position:relative}
.top{z-index:2}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:40}
.view{animation:viewin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="top">
    <div class="brand"><i></i>finfluence</div>
    <div class="mode" role="tablist" aria-label="Mod">
      <button id="m-client" class="on" onclick="setMode('client')">Client</button>
      <button id="m-biz" onclick="setMode('biz')">Afacere</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
  <div class="toast" id="toast"></div>
  <canvas id="confetti"></canvas>
</div>

<script>
/* ---------- icons ---------- */
const I={
 cup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v3M12 3v3"/></svg>',
 burger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 6 0 0 1 16 0z"/><path d="M3 14h18"/><path d="M5 17h14a2 2 0 0 1-2 3H7a2 2 0 0 1-2-3z"/></svg>',
 spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',

const $=s=>document.querySelector(s);
const main=$('#main');
function cv(b){return `--c:${BIZ[b].c};--c-ink:${BIZ[b].ci}`}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function nowStr(){const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function ago(d){const x=S.day-d;return x<=0?'azi':x===1?'ieri':'acum '+x+' zile'}

/* ---------- navigation ---------- */
function go(fn){
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches){document.startViewTransition(()=>{fn();render()})}
  else{fn();render()}
}
function setMode(m){go(()=>{S.mode=m;S.open=null;S.res=null});}
function setTab(t){go(()=>{if(S.mode==='client'){S.tab=t;S.open=null}else{S.biztab=t;S.res=null}});main.scrollTop=0}

function renderTabs(){
  const items=S.mode==='client'
    ?[['wallet','Carduri',I.wallet],['discover','Descoperă',I.compass],['offers','Oferte',I.ticket],['me','Profil',I.user]]
    :[['scan','Scanează',I.scan],['stats','Statistici',I.chart],['promo','Campanii',I.bell]];
  const cur=S.mode==='client'?S.tab:S.biztab;
  $('#tabs').innerHTML=items.map(([k,l,ic])=>`<button class="${k===cur?'on':''}" onclick="setTab('${k}')" aria-label="${l}">${ic}<span>${l}</span></button>`).join('');
  $('#m-client').className=S.mode==='client'?'on':'';
  $('#m-biz').className=S.mode==='biz'?'on':'';
}

/* ---------- client: wallet ---------- */
function tex(id){const b=BIZ[id];const ic=I[b.icon].replace(/currentColor/g,b.ci).replace('<svg ','<svg x="X" y="Y" width="20" height="20" ');
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">'+ic.replace('X','6').replace('Y','6')+'<g transform="rotate(-18 44 44)">'+ic.replace('X','34').replace('Y','34')+'</g></svg>';
  return 'background-image:url("data:image/svg+xml,'+encodeURIComponent(svg)+'")'}
function cardHTML(id,extra='',i=0){
  const b=BIZ[id],c=S.cards[id],ready=c.pts>=b.max;
  let dots='';for(let i=0;i<b.max;i++)dots+=`<span class="${i<c.pts?'f':''}"></span>`;
  return `<button class="card ${ready?'is-ready':''}" style="${cv(id)};--i:${i};view-transition-name:card-${id}" ${extra}>
    <div class="tex" style='${tex(id)}'></div><div class="glare"></div>
    <div class="card-row">
      <div style="display:flex;gap:12px;align-items:center"><div class="logo">${I[b.icon]}</div><div><div class="card-name">${b.name}</div><div class="card-area">${b.area}</div></div></div>
      <div class="card-pts tnum">${c.pts}<small>/${b.max}</small></div>
    </div>
    <div class="card-foot">
      <div class="dots">${dots}</div>
      ${ready?`<span class="pill ready">${I.gift} Recompensă gata</span>`:`<div class="card-reward">${b.max-c.pts} până la<br><b>${b.reward}</b></div>`}
    </div>
  </button>`;
}
function wallet(){
  const ids=Object.keys(S.cards);
  const total=ids.reduce((a,k)=>a+S.cards[k].pts,0);
  const ready=ids.filter(k=>S.cards[k].pts>=BIZ[k].max).length;
  return `<div class="view">
    <h1 class="h-title">Cardurile tale</h1>
    <p class="h-sub">${ids.length} carduri · ${total} puncte strânse${ready?` · <b style="color:var(--ok)">${ready} recompens${ready>1?'e':'ă'} gata</b>`:''}</p>
    <div class="stack">${ids.map((id,i)=>cardHTML(id,`onclick="openCard('${id}')"`,i)).join('')}</div>
    <p class="section">Recomandate pentru tine</p>
    ${recoList(2)}
  </div>`;
}
function openCard(id){go(()=>{S.open=id})}

function cardDetail(id){
  const b=BIZ[id],c=S.cards[id],ready=c.pts>=b.max;
  let st='';for(let i=0;i<b.max;i++){const f=i<c.pts;st+=`<div class="stamp ${f?'f':''} ${f&&S.newStamp===id&&i===c.pts-1?'pop':''}">${I[b.icon]}</div>`}
  const code=S.code&&S.code.biz===id&&S.code.exp>Date.now()?S.code:null;
  const cooldown=c.last===S.day&&!ready;
  let action;
  if(code){
    const left=code.exp-Date.now(),pct=left/300000;
    action=`<div class="codebox">
      <div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--line)" stroke-width="3"/><circle id="ringc" cx="18" cy="18" r="15.5" fill="none" stroke="${b.c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="${97.4*(1-pct)}"/></svg><b id="ringt" class="tnum">${fmt(left)}</b></div>
      <div><div class="hint">${code.type==='reward'?'Cod pentru recompensă':'Arată codul la casă'}</div><div class="code tnum">${[...code.code].map((d,i)=>`<span style="animation-delay:${i*110}ms">${d}</span>`).join('')}</div><div class="hint">Angajatul îl introduce și îți dă ${code.type==='reward'?'recompensa':'punctul'}.</div></div>
    </div>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="cancelCode()">Anulează codul</button>`;
  }else if(ready){
    action=`<button class="btn btn-brand" onclick="claim('${id}','reward')">${I.gift} Folosește recompensa: ${b.reward}</button>`;
  }else if(cooldown){
    action=`<button class="btn btn-ghost" disabled>Ai primit deja punctul de azi</button><p class="hint" style="text-align:center;margin-top:8px">Poți primi un punct pe zi la fiecare afacere.</p>`;
  }else{
    action=`<button class="btn btn-ink" onclick="claim('${id}','point')">Cere punctul de azi</button>`;
  }
  const hist=c.log.slice(0,4).map(d=>`<div class="li"><div class="mini-logo" style="--c:color-mix(in srgb,${b.c} 12%,#fff);--c-ink:${b.c}">${I.check}</div><div><div class="t">+1 punct</div><div class="s">${ago(d)}</div></div></div>`).join('');
  return `<div class="view detail">
    <button class="back" onclick="go(()=>{S.open=null})">${I.arrow} Cardurile tale</button>
    ${ready?`<div class="flip" id="flip" onclick="this.classList.toggle('on')" title="Atinge ca să întorci cardul"><div class="flip-in">${cardHTML(id,'tabindex="-1"')}<div class="card card-back" style="${cv(id)}"><div class="tex" style='${tex(id)}'></div><div class="gift">${I.gift}</div><div style="opacity:.8;position:relative">Recompensa ta</div><div class="rw">${b.reward}</div><div style="opacity:.7;font-size:12px;position:relative">Atinge ca să vezi cardul</div></div></div></div>`:cardHTML(id,'tabindex="-1"')}
    <div style="${cv(id)}">
      <div style="margin-top:24px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span style="font-weight:600">${ready?'Recompensă deblocată':b.reward}</span><span class="hint tnum">${ready?'Toate cele '+b.max+' puncte':'încă '+(b.max-c.pts)+' din '+b.max}</span></div>
        <div class="prog"><i style="width:${c.pts/b.max*100}%"></i></div>
      </div>
      <div class="stamps">${st}</div>
      <div style="margin-top:14px">${action}</div>
    </div>
    ${hist?`<p class="section">Vizitele tale</p><div class="list">${hist}</div>`:''}
  </div>`;
}
function fmt(ms){const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function claim(id,type){
  S.code={code:String(Math.floor(1000+Math.random()*9000)),biz:id,type,exp:Date.now()+300000};
  S.newStamp=null;save();render();
}
function cancelCode(){S.code=null;save();render()}

/* ---------- client: discover ---------- */
function recoList(n){
  const mine=Object.keys(S.cards);
  const myCats=mine.map(k=>BIZ[k].cat);
  let ids=Object.keys(BIZ).filter(k=>!mine.includes(k));
  if(S.tab==='discover'&&S.filter!=='Toate')ids=ids.filter(k=>BIZ[k].cat===S.filter);
  ids.sort((a,b)=>(BIZ[b].plan==='Diamond')-(BIZ[a].plan==='Diamond')||myCats.includes(BIZ[b].cat)-myCats.includes(BIZ[a].cat));
  if(n)ids=ids.slice(0,n);
  if(!ids.length)return `<div class="list"><div class="li"><div class="s">Nicio afacere nouă în categoria asta, momentan.</div></div></div>`;
  return `<div class="list">${ids.map(k=>{const b=BIZ[k];return `<div class="li"><div class="mini-logo" style="${cv(k)}">${I[b.icon]}</div><div><div class="t">${b.name}</div><div class="s">${b.cat} · ${b.dist} · ${b.reward} după ${b.max} vizite</div></div><button class="add" onclick="addCard('${k}')">Adaugă</button></div>`}).join('')}</div>`;
}
function discover(){
  const feat=Object.keys(BIZ).find(k=>BIZ[k].plan==='Diamond'&&!S.cards[k]);
  return `<div class="view">
    <h1 class="h-title">Descoperă</h1>
    <p class="h-sub">Locuri din Oradea alese după cardurile tale.</p>
    <div class="chips">${TAGS.map(t=>`<button class="chip ${S.filter===t?'on':''}" onclick="S.filter='${t}';render()">${t}</button>`).join('')}</div>
    ${feat&&(S.filter==='Toate'||S.filter===BIZ[feat].cat)?`<div class="diamond-wrap"><div class="feature" style="${cv(feat)}">
      <span class="pill" style="align-self:flex-start;position:relative">◆ Diamond · Recomandat</span>
      <div style="position:relative"><h2 style="font-size:26px">${BIZ[feat].name}</h2><div style="opacity:.8">${BIZ[feat].area} · ${BIZ[feat].dist}</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;position:relative"><span>${BIZ[feat].reward} după ${BIZ[feat].max} vizite</span><button class="add" style="background:var(--c-ink);color:var(--c)" onclick="addCard('${feat}')">Adaugă cardul</button></div>
    </div></div>`:''}
    <p class="section">${S.filter==='Toate'?'Aproape de tine':S.filter}</p>
    ${recoList(0)}
  </div>`;
}
function addCard(k){S.cards[k]={pts:0,last:-99,log:[]};save();toast('Cardul '+BIZ[k].name+' e în portofel');render()}

/* ---------- client: offers ---------- */
function offers(){
  const can=S.spunDay!==S.day;
  const n=WHEEL.length,seg=360/n;
  const grad=WHEEL.map((w,i)=>`${w.c} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  const labels=WHEEL.map((w,i)=>`<span style="transform:rotate(${i*seg+seg/2-90}deg) translate(28px,-6px)">${w.t}</span>`).join('');
  return `<div class="view">
    <h1 class="h-title">Oferte</h1>
    <p class="h-sub">Cupoane de la afacerile din jur și roata zilei.</p>
    <div class="wheel-wrap">
      <div style="align-self:flex-start"><div class="tag" style="color:#9DA8FF">Roata zilei</div><div style="font-family:var(--display);font-weight:700;font-size:20px">O încercare pe zi</div></div>
      <div class="wheel-box"><div class="pointer"></div><div class="wheel" id="wheel" style="background:conic-gradient(${grad});transform:rotate(${S.spinDeg}deg)">${labels}</div><div class="hub">SPIN</div></div>
      <button class="btn btn-accent" id="spinbtn" onclick="spin()" ${can?'':'disabled'}>${can?'Învârte roata':'Revino mâine pentru o nouă încercare'}</button>
    </div>
    <p class="section">Cupoanele tale</p>
    <div style="display:flex;flex-direction:column;gap:10px">${S.coupons.map(c=>`<div class="coupon" style="${cv(c.biz)}"><div class="l">${c.v}<small>${BIZ[c.biz].cat}</small></div><div class="rgt">${c.feat?'<span class="tag">Recomandat</span>':''}<b>${BIZ[c.biz].name}</b><span class="hint">${c.t}</span><span class="hint">${c.until}</span></div></div>`).join('')}</div>
  </div>`;
}
function spin(){
  const n=WHEEL.length,seg=360/n,pick=Math.floor(Math.random()*n);
  const target=360-(pick*seg+seg/2);
  S.spinDeg=S.spinDeg-(S.spinDeg%360)+360*5+target;
  S.spunDay=S.day;
  $('#wheel').style.transform=`rotate(${S.spinDeg}deg)`;
  $('#spinbtn').disabled=true;
  setTimeout(()=>{
    const w=WHEEL[pick];
    if(w.t==='Mai încearcă'){toast('Nu de data asta. Revino mâine!')}
    else if(w.t==='+1 punct'){S.cards.central.pts=Math.min(BIZ.central.max,S.cards.central.pts+1);toast('+1 punct la Cafeneaua Central');confetti()}
    else{const biz=w.t.includes('cafea')?'central':w.t.includes('desert')?'dulce':'smash';S.coupons.unshift({biz,v:w.t.match(/-\d+%/)[0],t:'Câștigat la roata zilei',until:'valabil 7 zile'});toast('Ai câștigat '+w.t);confetti()}
    save();render();
  },4300);
}

      <div class="li"><div class="mini-logo" style="--c:${S.phone?'var(--accent)':'#D9D9D3'};--c-ink:#fff">${I.user}</div><div><div class="t">${S.phone||'Card anonim'}</div><div class="s">${S.phone?'Portofel unificat activ · primești oferte':'Adaugă numărul ca să nu pierzi cardurile'}</div></div></div>
    </div>
    ${S.phone?'':`<p class="section">Adaugă numărul</p><input class="field" id="ph2" inputmode="tel" placeholder="07xx xxx xxx"><label class="check"><input type="checkbox" id="g2"> Sunt de acord ca Finfluence să-mi păstreze numărul și să-mi trimită oferte. Pot retrage acordul oricând.</label><button class="btn btn-ink" onclick="savePhone('ph2','g2')">Salvează</button><p id="perr2" class="hint" style="color:var(--err);margin-top:8px"></p>`}
    <p class="section">Datele tale</p>
    <div class="list">
      <div class="li"><div><div class="t">Ce păstrăm</div><div class="s">Un cod unic al cardului, punctele${S.phone?' și numărul de telefon':''}. Serverele sunt în Uniunea Europeană.</div></div></div>
      <div class="li"><button style="color:var(--err);font-weight:700" onclick="if(S._del){S=fresh();save();render();toast('Datele au fost șterse')}else{S._del=1;toast('Apasă din nou ca să ștergi tot')}">Șterge toate datele mele</button></div>
    </div>
    <p class="section">Demo</p>
    <div class="list"><div class="li"><div><div class="t">Ziua simulată: ${S.day===0?'azi':'+'+S.day}</div><div class="s">Treci la ziua următoare ca să poți primi din nou puncte.</div></div><button class="add" onclick="nextDay()">Ziua următoare</button></div>
    <div class="li"><button style="font-weight:700;color:var(--accent)" onclick="S=fresh();save();render()">Repornește demo-ul de la început</button></div></div>
  </div>`;
}
function savePhone(i,g){
  const v=$('#'+i).value.replace(/\s/g,''),ok=$('#'+g).checked,err=$('#perr'+(i==='ph2'?'2':''));
  if(!/^07\d{8}$/.test(v)){err.textContent='Scrie un număr de mobil din România, de forma 07xx xxx xxx.';return}
  if(!ok){err.textContent='Bifează acordul ca să putem păstra numărul.';return}
  S.phone=v.replace(/(\d{4})(\d{3})(\d{3})/,'$1 $2 $3');S.onboarded=true;save();
  if(i==='ph')go(()=>{});else{render();toast('Numărul a fost salvat')}
}
function nextDay(){S.day++;S.code=null;S._del=0;save();render();toast('Ai trecut la ziua următoare')}

/* ---------- onboarding (după scanarea QR-ului de la tejghea) ---------- */
function onboarding(){
  return `<div class="onb" style="${cv('central')}">
    <div class="onb-hero">
      <div class="logo" style="width:56px;height:56px;border-radius:16px;position:relative">${I.cup}</div>
      <h1 style="font-size:36px;line-height:1;margin-top:18px;position:relative">Cardul tău la<br>Cafeneaua Central</h1>
      <p style="opacity:.85;margin-top:10px;position:relative">A 10-a cafea e din partea casei. Fără aplicație de descărcat, fără cartonaș de pierdut.</p>
    </div>
    <div class="onb-body">
      <h2 style="font-size:22px">Adaugă-ți numărul</h2>
      <div class="benefits">
        <div><i>1</i>Vezi punctele de la toate localurile într-un singur loc</div>
        <div><i>2</i>Primești oferte de la locurile tale preferate</div>
        <div><i>3</i>Nu pierzi cardul dacă îți schimbi telefonul</div>
      </div>
      <label for="ph" class="hint" style="font-weight:600">Număr de mobil</label>
      <input class="field" id="ph" inputmode="tel" placeholder="07xx xxx xxx">
      <label class="check"><input type="checkbox" id="g1"> Sunt de acord ca Finfluence să-mi păstreze numărul și să-mi trimită oferte. Pot retrage acordul oricând.</label>
      <p id="perr" class="hint" style="color:var(--err);margin:-6px 0 10px"></p>
      <button class="btn btn-ink" onclick="savePhone('ph','g1')">Continuă cu numărul</button>
      <button class="btn" style="color:var(--muted);margin-top:4px" onclick="go(()=>{S.onboarded=true;save()})">Poate mai târziu</button>
    </div>
  </div>`;
}

/* ---------- business: scan ---------- */
function bizHead(){
  return `<div class="biz-head"><div class="mini-logo" style="${cv('central')}">${I.cup}</div><div><div class="t" style="font-weight:700">Cafeneaua Central</div><div class="hint">Tură: Ana · plan Gold</div></div><span class="pill" style="margin-left:auto;background:var(--ok-soft);color:var(--ok)">● Online</span></div>`;
}
function scan(){
  const slots=[0,1,2,3].map(i=>`<div class="slot tnum ${S.entry[i]?'fill':''}">${S.entry[i]||''}</div>`).join('');
  const keys=['1','2','3','4','5','6','7','8','9','','0','del'].map(k=>k===''?'<span></span>':`<button onclick="key('${k}')" aria-label="${k==='del'?'Șterge':k}">${k==='del'?I.del:k}</button>`).join('');
  const active=S.code&&S.code.exp>Date.now()?S.code:null;
  let res='';
  if(S.res){const r=S.res,ic=r.k==='ok'?I.check:r.k==='warn'?I.clock:I.x;res=`<div class="result ${r.k}">${ic}<div><b>${r.t}</b>${r.m}${r.k==='warn'?`<br><button onclick="nextDay()">Demo: treci la ziua următoare</button>`:''}</div></div>`}
  return `<div class="view">
    ${bizHead()}
    <h1 class="h-title" style="margin-top:22px">Introdu codul clientului</h1>
    <p class="h-sub" style="margin-bottom:0">Clientul îți arată pe telefon un cod de 4 cifre, valabil 5 minute.</p>
    <div class="slots" id="slots">${slots}</div>
    ${res}
    <div class="pad">${keys}</div>
    <div class="demo-hint">${active?`<span>Demo: clientul are activ codul <b class="tnum" style="color:var(--ink)">${active.code}</b></span><button onclick="S.entry='${active.code}';validate()">Folosește-l</button>`:`<span>Demo: cere un cod din modul Client, pe un card.</span><button onclick="setMode('client')">Mergi la Client</button>`}</div>
  </div>`;
}
function key(k){
  if(k==='del'){S.entry=S.entry.slice(0,-1);S.res=null;render();return}
  if(S.entry.length>=4)S.entry='';
  S.entry+=k;S.res=null;
  if(S.entry.length===4){render();setTimeout(validate,180)}else render();
}
function validate(){
  const e=S.entry,c=S.code;
  const log=(what,bad)=>{S.scans.unshift({who:'Ana',t:nowStr(),what,cust:'Client #'+(S.phone?'0'+S.phone.slice(-3):'A41'),bad})};
  if(!c||c.code!==e){S.res={k:'err',t:'Cod greșit',m:'Nu există niciun cod activ cu aceste cifre. Verifică din nou ecranul clientului.'};log('Cod respins (greșit)',1);shake()}
  else if(c.exp<Date.now()){S.res={k:'err',t:'Cod expirat',m:'Codul a trecut de 5 minute. Roagă clientul să ceară unul nou.'};log('Cod respins (expirat)',1);S.code=null;shake()}
  else if(c.biz!=='central'){S.res={k:'err',t:'Cod de la altă afacere',m:'Codul e pentru '+BIZ[c.biz].name+', nu pentru Cafeneaua Central.'};log('Cod respins (altă afacere)',1);shake()}
  else{
    const card=S.cards.central,b=BIZ.central;
    if(c.type==='reward'){
      card.pts=0;S.code=null;S.res={k:'ok',t:'Recompensă validată',m:'Oferă clientului: '+b.reward+'. Cardul începe de la zero.'};log('Recompensă: '+b.reward);
    }else if(card.last===S.day){
      S.res={k:'warn',t:'Clientul a primit deja punctul azi',m:'Regula e un punct pe zi, ca să nu se poată abuza de card.'};log('Respins: deja punctat azi',1);S.code=null;
    }else{
      card.pts++;card.last=S.day;card.log.unshift(S.day);S.granted++;S.code=null;S.newStamp='central';
      S.res={k:'ok',t:'+1 punct acordat',m:'Clientul are acum '+card.pts+' din '+b.max+'.'+(card.pts>=b.max?' Recompensa e deblocată!':'')};log('+1 punct');
      if(card.pts>=b.max)confetti();
    }
  }
  S.entry='';save();render();
}
function shake(){requestAnimationFrame(()=>{const s=$('#slots');if(s){s.classList.add('shake')}})}

/* ---------- business: stats ---------- */
function stats(){
  const week=[22,31,27,35,41,38,S.scans.filter(s=>!s.bad).length+18];
  const days=['L','Ma','Mi','J','V','S','D'];
  const mx=Math.max(...week);
  return `<div class="view">
    ${bizHead()}
    <h1 class="h-title" style="margin-top:22px">Cum merge cardul</h1>
    <p class="h-sub">Ultimele 7 zile · date exemplu, în afară de scanările de azi.</p>
    <div class="kpis">
      <div class="kpi"><div class="k">Clienți înscriși</div><div class="v tnum" data-count="186">186</div><div class="d">+23 săpt. asta</div></div>
      <div class="kpi"><div class="k">Rata de înscriere</div><div class="v tnum" data-count="46" data-suf="%">46%</div><div class="d">peste ținta de 40%</div></div>
      <div class="kpi"><div class="k">Revin în 14 zile</div><div class="v tnum" data-count="58" data-suf="%">58%</div><div class="d">față de 34% fără card</div></div>
      <div class="kpi"><div class="k">Puncte acordate</div><div class="v tnum" data-count="${S.granted}">${S.granted}</div><div class="k">azi, de 2 angajați</div></div>
    </div>
    <p class="section">Vizite cu card pe zi</p>
    <div class="chart"><div class="bars">${week.map((v,i)=>`<div class="${i<6?'dim':''}" style="height:${v/mx*100}%;animation-delay:${i*50}ms" title="${v} vizite"></div>`).join('')}</div><div class="axis">${days.map(d=>`<span>${d}</span>`).join('')}</div></div>
    <p class="section">Toate scanările de azi</p>
    <div class="list">${S.scans.slice(0,8).map(s=>`<div class="li"><div class="mini-logo" style="--c:${s.bad?'var(--err-soft)':'var(--ok-soft)'};--c-ink:${s.bad?'var(--err)':'var(--ok)'}">${s.bad?I.x:I.check}</div><div><div class="t">${s.what}</div><div class="s">${s.cust} · de ${s.who}</div></div><div class="r tnum">${s.t}</div></div>`).join('')}</div>
  </div>`;
}

/* ---------- business: campaigns ---------- */
function promo(){
  return `<div class="view">
    ${bizHead()}
    <h1 class="h-title" style="margin-top:22px">Trimite o ofertă</h1>
    <p class="h-sub">Ajunge la clienții cu card care au acceptat să primească oferte.</p>
    <p class="section" style="margin-top:0">Către cine</p>
    <div class="chips" id="aud">${[['Toți clienții','128'],['N-au mai venit de 14 zile','37'],['Aproape de recompensă','19']].map((a,i)=>`<button class="chip ${i===1?'on':''}" data-n="${a[1]}" onclick="document.querySelectorAll('#aud .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');document.getElementById('cnt').textContent=this.dataset.n">${a[0]} · ${a[1]}</button>`).join('')}</div>
    <p class="section">Mesajul</p>
    <textarea id="msg" aria-label="Mesajul ofertei">Ne e dor de tine! Vino săptămâna asta și primești punct dublu la orice cafea. ☕</textarea>
    <button class="btn btn-ink" style="margin-top:12px" onclick="sendPromo()">Trimite către <span id="cnt" style="margin:0 4px">37</span> clienți</button>
    ${S.sent.length?`<p class="section">Trimise</p><div class="list">${S.sent.map(s=>`<div class="li"><div class="mini-logo" style="--c:var(--accent-soft);--c-ink:var(--accent)">${I.bell}</div><div><div class="t" style="font-weight:500">${s.m}</div><div class="s">${s.n} clienți · ${s.t}</div></div></div>`).join('')}</div>`:''}
    <p class="hint" style="margin-top:14px">Demo: mesajele nu pleacă nicăieri. În aplicația reală ajung ca notificare sau SMS.</p>
  </div>`;
}
function sendPromo(){const m=$('#msg').value.trim();if(!m){toast('Scrie un mesaj înainte să trimiți');return}S.sent.unshift({m,n:$('#cnt').textContent,t:nowStr()});save();render();toast('Oferta a fost programată')}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d'),r=cv.getBoundingClientRect();
  cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#2F45FF','#0F7A55','#E0512A','#F2C14E','#A33A54'];
  const P=Array.from({length:90},()=>({x:r.width/2,y:r.height*.45,vx:(Math.random()-.5)*9,vy:-Math.random()*10-4,s:Math.random()*6+4,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function tick(){ctx.clearRect(0,0,r.width,r.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(++f<110)requestAnimationFrame(tick);else ctx.clearRect(0,0,r.width,r.height)})();
}

/* ---------- render ---------- */
function render(){
  renderTabs();
  let h;
  if(S.mode==='client'){
    h=S.open?cardDetail(S.open):S.tab==='wallet'?wallet():S.tab==='discover'?discover():S.tab==='offers'?offers():me();
  }else{
    h=S.biztab==='scan'?scan():S.biztab==='stats'?stats():promo();
  }
  main.innerHTML=h;
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
    main.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suf||'',t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;if(p<1)requestAnimationFrame(f)})(t0)});
    const fl=$('#flip');if(fl)setTimeout(()=>fl.classList.add('on'),650);
  }
  if(S.newStamp&&S.mode==='client'&&S.open===S.newStamp){const c=S.cards[S.newStamp];if(c.pts>=BIZ[S.newStamp].max)setTimeout(confetti,300);S.newStamp=null;save()}
}
main.addEventListener('pointermove',e=>{
  if(matchMedia('(prefers-reduced-motion:reduce)').matches||e.pointerType==='touch')return;
  const c=e.target.closest('.card');main.querySelectorAll('.card.tilting').forEach(x=>{if(x!==c)untilt(x)});
  if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  c.classList.add('tilting');c.style.setProperty('--ry',((x-.5)*14)+'deg');c.style.setProperty('--rx',((.5-y)*12)+'deg');
  c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');
});
main.addEventListener('pointerleave',()=>main.querySelectorAll('.card.tilting').forEach(untilt));
function untilt(c){c.classList.remove('tilting');c.style.removeProperty('--rx');c.style.removeProperty('--ry')}
setInterval(()=>{
  if(!S.code)return;
  if(S.code.exp<Date.now()){S.code=null;save();if(S.mode==='client'&&S.open)render();return}
  const t=$('#ringt'),c=$('#ringc');
  if(t){const left=S.code.exp-Date.now();t.textContent=fmt(left);c.setAttribute('stroke-dashoffset',97.4*(1-left/300000))}
},1000);
render();
</script>
